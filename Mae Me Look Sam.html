<style>
/* TikTok tap-through cards — @mt.sale's videos aren't embeddable,
   so we render a matching play card that opens the video on TikTok. */
.tt-card {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 267 / 476;
  border-radius: 14px;
  overflow: hidden;
  text-decoration: none;
  background:
    radial-gradient(120% 80% at 50% 50%, rgba(0,0,0,0.15), rgba(0,0,0,0.55) 80%),
    linear-gradient(160deg, #2a1f17 0%, #16110d 60%, #0d0a07 100%);
  border: 1px solid rgba(184, 149, 106, 0.25);
  box-shadow: 0 40px 70px -38px rgba(92, 68, 53, 0.65);
  cursor: pointer;
  transition: transform .3s ease;
}
.tt-card:hover { transform: translateY(-3px); }
.tt-card__play {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 64px;
  height: 64px;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: rgba(184, 149, 106, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
  transition: transform 0.2s ease, background 0.2s ease;
}
.tt-card:hover .tt-card__play {
  transform: translate(-50%, -50%) scale(1.08);
  background: #B8956A;
}
.tt-card__play::before {
  content: "";
  width: 0;
  height: 0;
  margin-left: 4px;
  border-style: solid;
  border-width: 11px 0 11px 18px;
  border-color: transparent transparent transparent #fff;
}
.tt-card__label {
  position: absolute;
  bottom: 12px;
  left: 12px;
  right: 12px;
  color: rgba(255,255,255,0.85);
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-align: center;
  font-family: "Cormorant Garamond", serif;
}
</style>
